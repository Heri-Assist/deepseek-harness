# Experimental durable layered memory over the shipped composition, which carries
# no memory rows. `memory` owns one SQLite store under $DSH_HOME and registers
# the remember, recall, and forget model tools; `memory-context` recalls matching
# saved facts into eligible steps automatically.

- insert:
    - id: memory
      name: '@deepseek-ai/dsh-memory'
    - id: memory-context
      name: '@deepseek-ai/dsh-memory-context'
